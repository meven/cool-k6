# The performance dashboard: static files in the results store. The dashboard
# links each run with paths relative to index.html, so the store is served as
# it stands.

# The documents page opens documents in the coolwsd of deploy/docs-server, whose WebSocket
# needs the Upgrade header passed on.
map $http_upgrade $cool_docs_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root @STORE@;
    index index.html;

    # Browse older runs, their logs and their flamegraphs.
    autoindex on;

    # Each night rewrites index.html, so a browser must ask for it again.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The Schedule tab deletes and queues runs through deploy/runs-api.py.
    location /api/ {
        proxy_pass http://127.0.0.1:@API_PORT@;
        # The service compares the Origin of a request with this host.
        proxy_set_header Host $http_host;
        client_max_body_size 64k;
        # Deleting runs rebuilds the dashboard, which takes a few seconds.
        proxy_read_timeout 120s;
    }

    # The coolwsd of deploy/docs-server, for the documents page. It builds the addresses of the
    # editor from the Host header, so they name this host as the browser reached it.
    location ~ ^/(browser|cool|hosting)/ {
        proxy_pass http://127.0.0.1:@DOCS_PORT@;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cool_docs_connection;
        # A document stays open for hours, and an upload of an image is up to 200 MB.
        proxy_read_timeout 1d;
        client_max_body_size 200m;
    }

    location ~ /\. {
        deny all;
    }
}
