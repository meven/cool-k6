# The performance dashboard: static files in the results store. The dashboard
# links each run with paths relative to index.html, so the store is served as
# it stands.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root @STORE@;
    index index.html;

    # Browse older runs, their logs and their flamegraphs.
    autoindex on;

    # Each night rewrites index.html, so a browser must ask for it again.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The Runs tab deletes runs through deploy/runs-api.py.
    location /api/ {
        proxy_pass http://127.0.0.1:@API_PORT@;
        # The service compares the Origin of a request with this host.
        proxy_set_header Host $http_host;
        client_max_body_size 64k;
        # Deleting runs rebuilds the dashboard, which takes a few seconds.
        proxy_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
